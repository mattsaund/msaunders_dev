<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cosmos.js: ASCII planet generator</title>
<meta name="description" content="Design an ASCII planet with live preview, then copy it out as standalone Python or JavaScript.">
<!-- Relative on purpose: the same tag works when this is served from the
     repo root by cosmos.py and when the folder is dropped into a site. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Fetched ahead of the stylesheet that asks for it. Without this the font
     is not discovered until the CSS has parsed, which is a visible swap on a
     page whose whole subject is the shape of a glyph. crossorigin is not
     optional even same origin: fonts are always fetched in CORS mode, and a
     preload without it is simply downloaded twice. -->
<link rel="preload" href="fonts/paper-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=a8c2cf52">
<style>
/* The site's bar over the tool. Added by tools/build_pages.py; not part of
   upstream cosmos.js, which as of its bar removal knows nothing about one.
   Hence --site-bar-h rather than the old --bar-h: that token went with the
   markup, and the height is the site's own business now. */
:root { --site-bar-h: 40px; }
.site-bar {
  display: flex; align-items: center; flex-wrap: nowrap;
  gap: 12px; height: var(--site-bar-h);
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}
/* The tool is exactly one window tall (.app is 100dvh) and turns the page's
   scroll off, so under this bar its bottom 40px would sit past the window's
   edge with no way to reach them. The app gives the bar's height back. Only
   where app.css lays the tool out across one screen: this query is the exact
   complement of its (max-width: 900px), so a fractional width from zoom or
   display scaling cannot fall between the two. At 900 and under the panels
   stack, the page scrolls again, and the bar just sits on top. */
@media (width > 900px) {
  .app { height: calc(100dvh - var(--site-bar-h)); }
}
.site-bar__back {
  display: inline-flex; align-items: center;
  color: var(--fg-3); text-decoration: none;
  padding: 5px 2px; flex: none;
  transition: color .15s;
}
/* Drawn, not typed, like the arrow in the Crucible and tiny bars: a "<-" is
   whatever the font makes of it, and Paper Mono makes ligatures of arrows. A
   path is the same in every face. */
.site-bar__back svg {
  width: 14px; height: 14px; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.site-bar__back:hover { color: var(--fg); }
.site-bar__name {
  font: 500 15px/15px var(--font); color: var(--fg);
  letter-spacing: 0; margin: 0; flex: none;
}
/* The mark is markup rather than ::before so its tilde can be lifted: Paper
   Mono sets the tilde under the slash's middle (see .tilde in /css/site.css). */
.site-bar__mark { color: var(--fg-3); }
.site-bar__tilde { position: relative; top: -0.09375em; }
/* Truncates rather than wraps, so the bar keeps its height on a narrow window. */
.site-bar__repo {
  font: 400 12px/15px var(--font); color: var(--fg-3);
  text-decoration: none; transition: color .15s;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.site-bar__repo:hover { color: var(--fg); text-decoration: underline; }
</style>
</head>
<body>

<header class="site-bar">
  <a class="site-bar__back" href="/" aria-label="Back to msaunders.dev"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></a>
  <h1 class="site-bar__name"><span class="site-bar__mark"><span class="site-bar__tilde">~</span>/</span>cosmos.js</h1>
  <a class="site-bar__repo" href="https://github.com/mattsaund/cosmos.js"
     target="_blank" rel="noopener">github.com/mattsaund/cosmos.js</a>
</header>

<!-- Three panels side by side on one screen: controls on the left, the square
     preview in the middle, generated code on the right. The grid that
     arranges them, and folds them into one column on a phone, is in
     css/app.css. -->
<main class="app">

  <!-- Controls are built by js/app.js from a single spec, so the sliders and
       the exported config cannot drift apart. -->
  <section class="panel controls" aria-label="Controls">
    <div id="controls"></div>
    <div class="row">
      <button type="button" id="randomize">Randomize</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <!-- The planet itself, as text, exactly as it is drawn at the moment the
         button is pressed. Not the generated source: that is what Copy over in
         the code panel is for. -->
    <div class="row row--center">
      <button type="button" id="copy-art">Copy planet to clipboard</button>
    </div>
    <!-- The same frame again, drawn into a canvas at 3840x2160 on black and
         handed over as a PNG. Nothing is re-rendered: it is the glyphs that
         were on screen, trimmed to the art and set large. -->
    <div class="row row--center">
      <button type="button" id="screenshot">Save screenshot</button>
    </div>
  </section>

  <!-- Preview. #dims reports the glyph grid. The planet itself is plain text
       inside #out, which is the whole idea: no canvas, no images. Spin lives
       over in the controls now, and only parks the angle: the loop in tick()
       keeps running either way. -->
  <section class="panel preview" aria-label="Preview">
    <div class="panel__head">
      <span id="dims" class="dim">-</span>
    </div>
    <div class="stage"><pre id="out" aria-live="off"></pre></div>
  </section>

  <!-- Generated code. Both panes are always filled by app.js; the tabs only
       decide which one is visible, and which one Copy copies. -->
  <section class="panel code" aria-label="Generated code">
    <div class="panel__head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab is-on" data-pane="py">planet.py</button>
        <button type="button" role="tab" class="tab" data-pane="js">planet.js</button>
      </div>
      <button type="button" id="copy">Copy</button>
    </div>
    <pre class="src is-on" id="pane-py"><code></code></pre>
    <pre class="src" id="pane-js"><code></code></pre>
  </section>

</main>

<!-- Plain scripts, no module system, so the order is the dependency graph:
     planet.js defines Cosmos, emit.js defines Emit and reads Cosmos when it
     runs, and app.js uses both the moment it loads. app.js goes last. -->
<script src="js/planet.js?v=5a6af0ef"></script>
<script src="js/emit.js?v=f95c9571"></script>
<script src="js/app.js?v=9a765807"></script>
</body>
</html>
